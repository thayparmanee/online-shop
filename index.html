<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>4King77slotonline</title>
<style>
  :root{
    --bg-0:#0e0e12;
    --bg-1:#17171d;
    --card:#1b1b22;
    --card-border:#2c2c36;
    --gold:#e8c874;
    --gold-2:#c9a24a;
    --text-0:#f3f1ea;
    --text-1:#b9b7c3;
    --text-2:#7c7a89;
    --fb:#3b5fe2;
    --wa:#25d366;
    --tg:#2ea6e0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{
    width:100%;
    min-height:100vh;
    min-height:100dvh; /* ຄວາມສູງແທ້ຂອງໜ້າຈໍມືຖື ບໍ່ນັບແຖບ URL ຂອງ browser */
    background:
      radial-gradient(circle at 50% 0%, #26232f 0%, #0e0e12 55%),
      linear-gradient(180deg,#0c0c10 0%,#0e0e12 100%);
    font-family:"Noto Sans Lao","Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text-0);
    -webkit-font-smoothing:antialiased;
  }
  /* ============ ອັດຕະໂນມັດປັບຂະໜາດຕາມໜ້າຈໍ ============
     - ມືຖືຈໍນ້ອຍ (≤380px): ໜາແໜ້ນ, ໂຕໜັງສືນ້ອຍລົງໜ້ອຍໜຶ່ງ
     - ມືຖືທົ່ວໄປ (381–600px): ຂະໜາດມາດຕະຖານ
     - ແທັບເລັດ/ຄອມ (>600px): ໜ້າຈະຄົງຄວາມກວ້າງແບບກາດຢູ່ກາງຈໍ ບໍ່ຍືດອອກຈົນເບິ່ງແປກ */
  .page{
    width:100%;
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 clamp(14px,4.5vw,20px) calc(110px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    position:relative;
  }
  /* decorative soft shapes instead of a photo background */
  .glow{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:.25;
    z-index:0;
    pointer-events:none;
  }
  .glow.g1{width:260px;height:260px;background:var(--gold);top:-60px;left:-80px;}
  .glow.g2{width:220px;height:220px;background:#4a3fbf;top:220px;right:-90px;opacity:.2;}
  .glow.g3{width:200px;height:200px;background:#2ea6e0;bottom:60px;left:-70px;opacity:.15;}

  /* ແຖບໂຄສະນາເລື່ອນອັດຕະໂນມັດ */
  .promo-ticker{
    width:100%;
    overflow:hidden;
    z-index:1;
    padding:13px 0;
    border-bottom:1px solid #202027;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  }
  .promo-track{
    display:flex;
    width:max-content;
    gap:32px;
    animation:promo-scroll 24s linear infinite;
  }
  .promo-track .promo-item{
    display:inline-flex;
    align-items:center;
    gap:32px;
    font-size:12.5px;
    color:var(--text-1);
    white-space:nowrap;
    flex-shrink:0;
  }
  .promo-track .sep{color:var(--gold-2);}
  @keyframes promo-scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion: reduce){
    .promo-track{animation:none;}
  }

  .brand{
    z-index:1;
    text-align:center;
    margin-top:34px;
  }
  .brand .mark{
    width:74px;height:74px;
    margin:0 auto 10px;
    border-radius:50%;
    background:linear-gradient(145deg,#2a2a33,#151519);
    border:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;
    font-size:32px;
  }
  .brand h1{
    font-size:clamp(21px,6vw,26px);
    letter-spacing:1px;
    background:linear-gradient(180deg,#f6e9c2,var(--gold-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand p{
    margin-top:4px;
    font-size:12px;
    color:var(--text-2);
    letter-spacing:2px;
  }

  .status-pill{
    z-index:1;
    margin-top:18px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#141418;
    border:1px solid var(--card-border);
    padding:8px 16px;
    border-radius:999px;
    font-size:12px;
    color:var(--text-1);
  }
  .status-pill .dot{
    width:8px;height:8px;border-radius:50%;
    background:#3ddc84;
    box-shadow:0 0 8px #3ddc84;
  }

  .card{
    z-index:1;
    width:100%;
    margin-top:26px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:clamp(20px,5.5vw,26px) clamp(16px,5vw,22px);
    text-align:center;
  }
  .card .eyebrow{
    font-size:11px;
    letter-spacing:2px;
    color:var(--gold-2);
    font-weight:600;
  }
  .card h2{
    margin-top:6px;
    font-size:24px;
    color:var(--gold);
    font-weight:700;
  }
  .card .desc{
    margin-top:10px;
    font-size:13px;
    line-height:1.6;
    color:var(--text-1);
  }

  .contact-list{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .contact-item{
    display:flex;
    align-items:center;
    gap:14px;
    background:#141418;
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:12px 16px;
    text-decoration:none;
    color:var(--text-0);
    transition:border-color .15s ease, transform .15s ease;
  }
  .contact-item:hover{border-color:var(--gold-2);transform:translateY(-1px);}
  .contact-item .icon{
    width:38px;height:38px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    color:#fff;
    flex-shrink:0;
  }
  .icon.fb{background:var(--fb);}
  .icon.wa{background:var(--wa);}
  .icon.tg{background:var(--tg);}
  .contact-item .label{text-align:left;}
  .contact-item .label b{display:block;font-size:14px;}
  .contact-item .label small{color:var(--text-2);font-size:11.5px;}

  .divider{
    width:100%;
    height:1px;
    background:var(--card-border);
    margin:22px 0 16px;
  }
  .auth-links{
    display:flex;
    justify-content:center;
    gap:18px;
    font-size:13px;
  }
  .auth-links a{
    color:var(--text-1);
    text-decoration:none;
    padding-bottom:2px;
    border-bottom:1px solid transparent;
  }
  .auth-links a:hover{color:var(--gold);border-color:var(--gold);}
  .auth-links .sep{color:#3a3a44;}

  /* bottom nav */
  .bottomnav{
    position:fixed;
    bottom:0;left:0;right:0;
    display:flex;
    justify-content:center;
    padding:14px 0 calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(10,10,13,.96),rgba(10,10,13,.7));
    backdrop-filter:blur(6px);
    z-index:2;
  }
  .bottomnav .inner{
    width:100%;
    max-width:480px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:0 clamp(16px,6vw,24px);
  }
  .bnav-item{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--text-2);
    text-decoration:none;
    font-size:10.5px;
  }
  .bnav-item .ico{font-size:18px;}
  .bnav-item.center{
    margin-top:-30px;
  }
  .bnav-item.center .ico{
    width:56px;height:56px;
    border-radius:50%;
    background:radial-gradient(circle,#232330,#141418);
    border:2px solid var(--gold-2);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    box-shadow:0 0 16px rgba(232,200,116,.25);
  }

  /* ຈໍນ້ອຍຫຼາຍ (ມືຖືເກົ່າ/ຈໍແຄບ) */
  @media (max-width:340px){
    .brand .mark{width:64px;height:64px;}
    .brand .mark svg{width:40px;height:40px;}
    .status-pill{font-size:11px;padding:6px 12px;}
    .contact-item{padding:10px 12px;}
  }
  /* ຈໍສູງພິເສດ ຫຼື ຈໍນອນ (landscape) ຢູ່ມືຖື — ຫຼຸດໄລຍະຫ່າງເທິງ-ລຸ່ມ ບໍ່ໃຫ້ຕ້ອງເລື່ອນຫຼາຍ */
  @media (max-height:640px){
    .brand{margin-top:18px;}
    .card{margin-top:16px;}
  }
  /* ແທັບເລັດ ຫຼື ຈໍຄອມ — ໜ້າຈະຄົງເປັນກາດຢູ່ກາງຈໍ ບໍ່ຍືດເຕັມຄວາມກວ້າງ */
  @media (min-width:601px){
    .page{padding-top:32px;}
  }
</style>
</head>

<script>
  /* ======================================================
     ແກ້ໄຂລິ້ງທັງໝົດຂອງເວັບໄຊທ໌ຢູ່ບ່ອນດຽວນີ້
     ພຽງແຕ່ປ່ຽນຄ່າຫຼັງ : ໃຫ້ເປັນລິ້ງ URL ຈິງຂອງທ່ານ (ຢູ່ໃນເຄື່ອງໝາຍ " ")
     ຖ້າສ່ວນໃດຍັງບໍ່ມີລິ້ງ, ປ່ອຍໄວ້ເປັນ "#" ໄດ້ (ຈະຄລິກແລ້ວບໍ່ໄປໃສ)
     ====================================================== */
  const LINKS = {
    // --- ຊ່ອງທາງຕິດຕໍ່ ---
    facebook: "https://www.facebook.com/profile.php?id=61581614384435",   // ລິ້ງເພຈ Facebook
    whatsapp: "https://www.facebook.com/profile.php?id=61581614384435",   // ລິ້ງ wa.me/8562xxxxxxxx
    telegram: "https://www.facebook.com/profile.php?id=61581614384435",   // ລິ້ງ t.me/ຊື່ບັນຊີ

    // --- ເຂົ້າສູ່ລະບົບ / ສະໝັກສະມາຊິກ ---
    login: "https://4king77online.com/",
    register: "https://4king77online.com/",

    // --- ເມນູລຸ່ມ ---
    bottomHome: "https://4king77online.com/",
    bottomShop: "https://4king77online.com/",
    bottomPromo: "https://4king77online.com/",
  };

  for (const id in LINKS) {
    const el = document.getElementById(id);
    if (el) el.setAttribute("href", LINKS[id]);
  }

  /* ======================================================
     ແກ້ໄຂຂໍ້ຄວາມໂຄສະນາທີ່ເລື່ອນຢູ່ແຖບເທິງສຸດ ຢູ່ບ່ອນນີ້
     - ເພີ່ມ/ລຶບ/ແກ້ໄຂຂໍ້ຄວາມໄດ້ຕາມໃຈ, ໃສ່ໄດ້ຫຼາຍລາຍການ ຄັ່ນດ້ວຍ ","
     - ຈະເລື່ອນວົນຊ້ຳໄປເລື້ອຍໆອັດຕະໂນມັດ ຄວາມໄວຄົງທີ່ບໍ່ວ່າຈະມີຈັກລາຍການ
     ====================================================== */
  const PROMO_TEXTS = [
    "🔥 ໂປຣໂມຊັ່ນພິເສດ ສັບລັບສະມາຊິກໃໝ່ ຮັບເຄດິດຄືນ 100% ",
    "ມີໂປຣໂມຊັ່ນປະຈຳວັນໃຫ້ຫຼິ້ນທຸກມື້ ",
    "📞 ສອບຖາມ ຕິດຕໍ່ແອດມິນ 24 ຊົ່ວໂມງ",
  ];

  const promoTrack = document.getElementById("promoTrack");
  if (promoTrack) {
    const buildItems = () => PROMO_TEXTS
      .map(t => `<span class="promo-item">${t}<span class="sep">✦</span></span>`)
      .join("");
    // ວາງຊ້ຳ 2 ຮອບ ເພື່ອໃຫ້ເລື່ອນວົນຮອບແບບບໍ່ມີຮອຍຕໍ່
    promoTrack.innerHTML = buildItems() + buildItems();

    requestAnimationFrame(() => {
      const halfWidth = promoTrack.scrollWidth / 2;
      const pxPerSecond = 50; // ຄວາມໄວການເລື່ອນ, ຕົວເລກຫຼາຍ = ໄວຂຶ້ນ
      const duration = Math.max(10, halfWidth / pxPerSecond);
      promoTrack.style.animationDuration = duration + "s";
    });
  }
</script>
